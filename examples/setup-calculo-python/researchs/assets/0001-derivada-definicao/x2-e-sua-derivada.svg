<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-labelledby="plot-title plot-desc" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<title id="plot-title">x² e a sua derivada 2x</title>
<desc id="plot-desc">Grafico (function): x² e a sua derivada 2x.
Eixo X = x: de -3 a 3 (escala linear).
Eixo Y = valor: de -7.2 a 10.2 (escala linear).
2 serie(s):
- &quot;f(x) = x²&quot;: cor laranja, marcador círculo, linha sólida; 121 ponto(s) plotado(s); minimo 0 em x = 0; maximo 9 em x = -3; muda de direcao 1 vez (um pico ou um vale).
- &quot;f&#x27;(x) = 2x&quot;: cor azul-céu, marcador quadrado, linha tracejada; 121 ponto(s) plotado(s); minimo -6 em x = -3; maximo 6 em x = 3; monotonica crescente.
Avisos: nenhum.
Leitura: A derivada cruza o zero exatamente onde a parábola tem o fundo: em x = 0 a inclinação de x² é nula.</desc>
