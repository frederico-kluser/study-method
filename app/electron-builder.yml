# electron-builder.yml — empacotamento do Study Method para TODOS os SO.
#
# Gerado em 2026-10-01 (onda de distribuição): antes disto o electron-builder
# era devDependency sem config — o instalador Windows da sessão anterior foi
# feito com config efémera (o app/dist/builder-debug.yml preserva os padrões).
# A regra de ouro deste ficheiro: CADA alvo empacota SÓ as variantes nativas da
# SUA plataforma. Os pacotes nativos viajam como pacotes opcionais por
# plataforma (node-llama-cpp → @node-llama-cpp/*, sherpa-onnx-node →
# sherpa-onnx-*, clipboard → @mariozechner/clipboard-*, reflink →
# @reflink/reflink-*); o build garante as variantes do alvo em node_modules
# (tools/build-installers.sh) e os `files` por plataforma abaixo EXCLUem as
# restantes — nunca confiar no que o npm instalou por acaso no host.
#
# Módulos nativos são N-API / prebuilt (koffi, napi-rs, sherpa-onnx,
# @node-llama-cpp): nada disso ganha com rebuild contra os headers do Electron
# e um rebuild cross-plataforma só quebraria → npmRebuild: false (decisão
# documentada, não preguiça).

appId: com.studymethod.gui
productName: Study Method
copyright: Copyright © 2026 study-method

directories:
  output: dist
  buildResources: build

# SEM auto-update/publish: com GH_TOKEN no ambiente o electron-builder tenta
# resolver um provider e rebenta em createUpdateInfoTasks (publishConfigs=[null],
# updateInfoBuilder.ts). `publish: null` corta a geração de latest*.yml antes.
publish: null

npmRebuild: false

# Empacotamento: out/ (bundle electron-vite) + package.json. node_modules é
# tratado à parte pelo electron-builder (só pacotes de produção, com os
# excludes por plataforma das secções win/mac/linux abaixo).
files:
  - out/**/*
  - package.json

# Fora do asar: tudo o que faz dlopen/require por caminho de ficheiro real ou é
# lido por um SUBPROCESSO node puro:
#   - @node-llama-cpp/* e node-llama-cpp — bins do llama.cpp carregados por path;
#   - sherpa-onnx-*, koffi, @reflink, @mariozechner — .node (napi);
#   - sql.js, tree-sitter-rust, web-tree-sitter, @silvia-odwyer — .wasm por path;
#   - out/main/vocab — o extrator Rust (vocab/rs/extract_ast.mjs) é spawnado com
#     process.execPath + ELECTRON_RUN_AS_NODE; fora do asar ele também corre em
#     node puro (suíte/CLI) e o createRequire acha web-tree-sitter no espelho
#     app.asar.unpacked/node_modules.
asarUnpack:
  - "**/node_modules/node-llama-cpp/**"
  - "**/node_modules/@node-llama-cpp/**"
  - "**/node_modules/sherpa-onnx-*/**"
  - "**/node_modules/koffi/**"
  - "**/node_modules/@reflink/**"
  - "**/node_modules/@mariozechner/**"
  - "**/node_modules/@silvia-odwyer/**"
  - "**/node_modules/sql.js/**"
  - "**/node_modules/tree-sitter-rust/**"
  - "**/node_modules/web-tree-sitter/**"
  - "**/out/main/vocab/**"

# Recursos ao lado do app.asar (= process.resourcesPath empacotado — a cadeia de
# candidatos de electron/main/services/resourcesDir.ts). O runner de estudo
# procura skills/study-method relativamente ao app (studyMethodRunner.ts:264).
# NOTA (2026-10-01): os assets de VOZ embutidos descritos em docs/app-gui.md §2.6
# (resources/tts-engine, resources/tts-models, resources/espeak-ng-data,
# resources/stt-models) NÃO existem neste repositório — entram aqui quando
# forem materializados; até lá a voz degrada para download do mirror em runtime.
extraResources:
  - from: resources/tracks
    to: tracks
  - from: resources/licenses
    to: licenses
  - from: ../skills/study-method
    to: skills/study-method

# ---------------------------------------------------------------------------
# Windows — NSIS x64 ("Study Method-Setup-0.1.0.exe")
# Mantém no node_modules: @node-llama-cpp/win-x64, sherpa-onnx-win-x64,
# @mariozechner/clipboard-win32-x64-msvc, @reflink/reflink-win32-x64-msvc.
# Variantes cuda/vulkan do llama.cpp ficam de fora (centenas de MB; o binário
# base CPU corre em todo o lado).
# ---------------------------------------------------------------------------
win:
  artifactName: "Study Method-Setup-${version}.${ext}"
  target:
    - target: nsis
      arch: [x64]
  files:
    - "!node_modules/@node-llama-cpp/{linux,mac}-*/**"
    - "!node_modules/@node-llama-cpp/win-arm64{,/**}"
    - "!node_modules/@node-llama-cpp/win-x64-cuda*{,/**}"
    - "!node_modules/@node-llama-cpp/win-x64-vulkan{,/**}"
    - "!node_modules/sherpa-onnx-{darwin,linux}-*/**"
    - "!node_modules/sherpa-onnx-win-ia32{,/**}"
    - "!node_modules/@mariozechner/clipboard-{darwin,linux}-*/**"
    - "!node_modules/@mariozechner/clipboard-win32-arm64-msvc{,/**}"
    - "!node_modules/@reflink/reflink-{darwin,linux}-*/**"
    - "!node_modules/@reflink/reflink-win32-arm64-msvc{,/**}"

# ---------------------------------------------------------------------------
# macOS — dmg + zip, arm64 (Apple Silicon) e x64 (Intel)
# Mantém TODAS as variantes darwin (arm64 + x64) em AMBOS os builds: o binário
# do Electron trava a arquitetura do .app, mas as variantes nativas a mais são
# inofensivas e cada instalador passa a funcionar sob Rosetta sem caça às
# variantes. Exclui linux/win32 e o clipboard universal (redundante).
# ---------------------------------------------------------------------------
mac:
  category: public.app-category.education
  minimumSystemVersion: "11.0"
  artifactName: "Study Method-${version}-mac-${arch}.${ext}"
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  files:
    - "!node_modules/@node-llama-cpp/{linux,win}-*/**"
    - "!node_modules/sherpa-onnx-{linux,win}-*/**"
    - "!node_modules/@mariozechner/clipboard-{linux,win32}-*/**"
    - "!node_modules/@mariozechner/clipboard-darwin-universal{,/**}"
    - "!node_modules/@reflink/reflink-{linux,win32}-*/**"

# ---------------------------------------------------------------------------
# Linux — AppImage + deb x64
# Mantém: @node-llama-cpp/linux-x64, sherpa-onnx-linux-x64,
# @mariozechner/clipboard-linux-x64-gnu, @reflink/reflink-linux-x64-gnu.
# Fora: musl, arm*, riscv*, cuda/vulkan.
# ---------------------------------------------------------------------------
linux:
  category: Education
  maintainer: study-method <study-method@users.noreply.github.com>
  synopsis: Tutor de programação com aula, desafios validados por teste e memória de progresso
  artifactName: "Study Method-${version}-linux-${arch}.${ext}"
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  files:
    - "!node_modules/@node-llama-cpp/{mac,win}-*/**"
    - "!node_modules/@node-llama-cpp/linux-arm*{,/**}"
    - "!node_modules/@node-llama-cpp/linux-x64-cuda*{,/**}"
    - "!node_modules/@node-llama-cpp/linux-x64-vulkan{,/**}"
    - "!node_modules/sherpa-onnx-{darwin,win}-*/**"
    - "!node_modules/sherpa-onnx-linux-arm64{,/**}"
    - "!node_modules/@mariozechner/clipboard-{darwin,win32}-*/**"
    - "!node_modules/@mariozechner/clipboard-linux-{arm64,riscv64}-*/**"
    - "!node_modules/@mariozechner/clipboard-linux-x64-musl{,/**}"
    - "!node_modules/@reflink/reflink-{darwin,win32}-*/**"
    - "!node_modules/@reflink/reflink-linux-arm64-*/**"
    - "!node_modules/@reflink/reflink-linux-x64-musl{,/**}"
